# ================================================================================= #
#                       FOZMINESPROOF PLUGIN MESSAGES CONFIGURATION                 #
#        Supports legacy color codes (&a, &b) and HEX colors (&#RRGGBB, #RRGGBB)   #
# ================================================================================= #

# ================================================== #
#              SYSTEM-WIDE MESSAGES                   #
# ================================================== #
system:
  prefix: "&#4e73df&l[FozmineSproof] &r"
  no-permission: "&#e74c3c❌ You do not have permission to execute this command!"
  reload-success: "&#2ecc71✅ Configuration reloaded and FakePlayer system synchronised successfully."
  only-player: "&#e74c3c⚠ This command can only be executed by a player in-game!"
  unknown-command: "&#e74c3c⚠ Unknown command. Use &#f1c40f/sproof help &r&#e74c3cto see command list."

# ================================================== #
#              COMMAND HELP MENU                      #
# ================================================== #
commands:
  help:
    header: "&#4e73df&m==================&r &#4e73df&lCOMMAND HELP &r&#4e73df&m=================="
    format: "&#f1c40f/sproof %syntax% &7- &#ffffff%description%"
    footer: "&#4e73df&m======================================================"
    list:
      add: "add <name> | Create a new bot entry at your current location"
      spawn: "spawn <name> | Activate and show the bot's 3D model"
      despawn: "despawn <name> | Hide the bot's model from the world"
      remove: "remove <name> | Permanently delete the bot from memory and SQL"
      list: "list | Show all bots currently in the system"
      info: "info <name> | View detailed coordinates and status of a bot"
      reload: "reload | Refresh all system configurations"

# ================================================== #
#              BOT-RELATED RESPONSES                 #
# ================================================== #
bot:
  # General errors
  not-found: "&#e74c3c❌ No FakePlayer found with the name &e%fakeplayer_name%&#e74c3c in the database!"
  already-exists: "&#e74c3c❌ A FakePlayer named &e%fakeplayer_name%&#e74c3c already exists!"
  invalid-name: "&#e74c3c❌ Invalid bot name! Only letters, numbers, and underscores allowed (3-16 characters)."

  # Add bot response
  add-success: "&#2ecc71✅ Successfully created static bot &e%fakeplayer_name% &7(World: &b%world%&7)."

  # Spawn bot responses
  spawn-success: "&#2ecc71🚀 Successfully spawned bot &e%fakeplayer_name%&#2ecc71 with 3D model!"
  already-spawned: "&#f1c40f⚠ Bot &e%fakeplayer_name%&#f1c40f is already spawned and active."

  # Despawn bot responses
  despawn-success: "&#e67e22💤 Successfully despawned bot &e%fakeplayer_name%&#e67e22."
  already-despawned: "&#f1c40f⚠ Bot &e%fakeplayer_name%&#f1c40f is already despawned."

  # Remove bot response
  remove-success: "&#e74c3c🗑 Permanently removed bot &e%fakeplayer_name%&#e74c3f from the system and SQL."

  # Info command format
  info-format:
    - "&#4e73df&lBOT INFO: &e%fakeplayer_name%"
    - " &7▪ Status: %status_formatted%"
    - " &7▪ UUID: &b%uuid%"
    - " &7▪ Location: &fX: %x% | Y: %y% | Z: %z% &7(&f%world%&7)"
    - " &7▪ Rotation: &fYaw: %yaw% | Pitch: %pitch%"
  status-online: "&#2ecc71● ONLINE"
  status-offline: "&#7f8c8d○ OFFLINE"

  # List command format
  list-header: "&#4e73df&lFAKEPLAYER LIST (%online%/%total%):"
  list-item-online: " &7- &e%fakeplayer_name% &7[%status_formatted%&7]"
  list-item-offline: " &7- &7%fakeplayer_name% &7[%status_formatted%&7]"
  list-empty: "&#f1c40f No FakePlayers have been created in the system yet."