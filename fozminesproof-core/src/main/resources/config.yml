# ================================================================================= #
#                       DATABASE CONNECTION SETTINGS                                 #
# ================================================================================= #
Database:
  # Enable MySQL database (false = use SQLite file-based storage)
  enable: false

  # Table name for storing fake player data (auto-sanitised)
  name: ""

  # Database name (for MySQL)
  database: ""

  # Database host (IP or domain)
  host: ""

  # Database port (default MySQL: 3306)
  port: 3306

  # Credentials
  user: ""
  password: ""

  # Proxy (BungeeCord / Velocity) bridging settings
  bridging-setting:
    # Enable to allow the FozmineSproof-bridge plugin on the proxy to access this table
    # and aggregate bot data across multiple servers.
    enable-proxy: false

    # Name of the bungee server (used as a key in the proxy sync table)
    bungee_name: "fozminesproof"



# ================================================================================= #
#                       FAKE PLAYER BEHAVIOR SETTINGS                               #
# ================================================================================= #
Fakeplayer-setting:
  hide-in-tab: false

  # Name of the dedicated void world where bots will be spawned
  botworld: "botworld"

  fake-plugin-name: "FozmineSpawner"

  # Show join/leave messages for bots in the global chat
  join-leave-message-enable: true
  # Join and leave message formats (supports color codes & and %fakeplayer_name%)
  join-message: "&8[&a+&8] &e%fakeplayer_name%"
  leave-message: "&8[&a+&8] &e%fakeplayer_name%"

  # Random delay range (in seconds) between bulk spawn/despawn operations
  # Format: "min-max" (e.g., "1-3" means 1 to 3 seconds)
  join-quit-interval: "1-3"

# ================================================================================= #
#                       FAKE PLAYER CHAT SYSTEM                                     #
# ================================================================================= #
chat-system:
  # Master toggle for the automatic chat system
  enabled: true

  # Target language for message translation (e.g., "vi", "ja", "fr", or "none" to disable)
  translation-target: "en"

  # How often a chat cycle starts (minutes). Use "0-0" for immediate testing.
  # Format: "min-max" for random range, or a single number for fixed interval
  interval-minutes: "0-0"

  # Number of bots that will speak per cycle (random range or fixed)
  bots-per-interval: "1-1"

  # Delay between each bot's message in the same cycle (seconds)
  delay-between-bots-seconds: "0-0"

  # Custom message formatting (toggle on/off)
  message-format:
    # If true, the plugin applies its own chat/tab format.
    # If false, it delegates formatting to other chat plugins (e.g., LPC, EssentialsX).
    enable: false

    # Chat format used when message-format is enabled
    chat-format: "&7[&a%fakeplayer_name%&7]&f: %fakeplayer_message%"

# ================================================================================= #
#                       DEBUG SETTINGS                                              #
# ================================================================================= #
debug: false