# ==================================================================================== #
#                         AUTOMATED CHAT RESPONDER (UPGRADED)                          #
# ==================================================================================== #
# Hệ thống tự động phản hồi thông minh dựa trên từ khóa dành cho Fake Players.

chat-interactions:
  player-greeting:
    # Từ khóa người chơi thật gõ (Hệ thống tự động lọc dấu câu, khoảng trắng và chữ thường)
    # Dấu * đại diện cho ký tự bất kỳ (Wildcard)
    triggers:
      - "hey"
      - "wassup"
      - "hi"
      - "hello"
      - "xin chao"
      - "chao ae"

    # Tỷ lệ kích hoạt (0.7 = 70% cơ hội bot sẽ trả lời, 30% bot sẽ lờ đi như người thật)
    chance: 0.7

    # Thời gian hồi chiêu (Giây) để chống người chơi cố tình spam từ khóa
    cooldowns:
      global: 15       # Cả cụm từ khóa này phải chờ 15 giây mới được kích hoạt lại
      per-player: 30   # Riêng người chơi vừa chat phải chờ 30 giây mới kích hoạt lại được

    # Số lượng fake player tối đa được phép phản hồi cùng một lúc
    max-burst: 2

    # Khoảng thời gian giả lập tốc độ gõ phím (Min-Max tính bằng giây)
    delay-range: "1.5-2.3"

    # Chỉ kích hoạt tính năng này trong khung giờ người chơi online nhiều (24h format)
    # Nếu muốn chạy 24/7 thì xóa dòng này hoặc để "00:00-23:59"
    active-hours: "08:00-23:30"

    # Kho câu thoại phản hồi (Hỗ trợ biến [name] để gọi tên người chơi thật)
    replies:
      - "welcome [name]"
      - "Hey [name]"
      - "Hi [name] khỏe không e"
      - "chao [name] nha"

  shop-helper:
    triggers:
      - "*how*sell*"
      - "*where*sell*"
      - "sell items"
      - "lam sao de ban do"
    chance: 0.9
    cooldowns:
      global: 10
      per-player: 20
    max-burst: 1
    delay-range: "2.0-3.5"
    active-hours: "00:00-23:59"
    replies:
      - "Gõ lệnh /shop để bán đồ nhanh nha [name]!"
      - "Dùng /shop nha bạn ơi"

  server-ip-info:
    triggers:
      - "*nap the*"
      - "*cua hang*"
      - "link store"
    chance: 1.0
    cooldowns:
      global: 5
      per-player: 15
    max-burst: 1
    delay-range: "2.0-3.0"
    active-hours: "00:00-23:59"
    replies:
      - "Ủng hộ server tại web: store.server.net nè [name]"

    discord-info:
      triggers:
        - "*discord*"
        - "*group zolo*"
        - "*kenh chat*"
      chance: 1.0
      cooldowns:
        global: 10
        per-player: 20
      max-burst: 1
      delay-range: "1.5-2.5"
      active-hours: "00:00-23:59"
      replies:
        - "Tham gia Discord của server tại: discord.gg/server cua ban nha [name]"
        - "Link discord nè [name]: discord.gg/server"

    rule-helper:
      triggers:
        - "*luat server*"
        - "*co duoc hack*"
        - "*cam pvp*"
      chance: 0.8
      cooldowns:
        global: 15
        per-player: 30
      max-burst: 1
      delay-range: "2.0-3.0"
      active-hours: "08:00-22:00"
      replies:
        - "Xem luật server tại /rules nha bạn [name], cấm hack/cheat nha!"
