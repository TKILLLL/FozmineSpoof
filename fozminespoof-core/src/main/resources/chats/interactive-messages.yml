# ==================================================================================== #
#              FOZMINESPOOF - DYNAMIC KEYWORD CHAT RESPONDER ENGINE                    #
# ==================================================================================== #
# Configure hyper-realistic, keyword-driven automated response rules for Fake Players.
# Tối ưu: Chỉ 2 nhóm dùng wildcard, còn lại dùng regex để bắt chính xác.

enable: true

chat-interactions:

  # ---------------------------------------------------------------------------------- #
  # Player Greetings & Welcome Automation (giữ wildcard, dễ mở rộng)
  # ---------------------------------------------------------------------------------- #
  player-greeting:
    triggers:
      - "hey"
      - "wassup"
      - "hi"
      - "hello"
      - "xin chao"
      - "chao ae"
    chance: 0.7
    cooldowns:
      global: 15
      per-player: 30
    max-burst: 2
    delay-range: "1.5-2.3"
    active-hours: "08:00-23:30"
    typing-speed-range: "0.8-1.8"
    pause-between-words: "2-4"
    use-regex: false
    fuzzy-threshold: 0.85
    replies:
      - "welcome [name]"
      - "Hey [name]"
      - "Hi [name] khỏe không e"
      - "chao [name] nha"

  # ---------------------------------------------------------------------------------- #
  # Economy & Shop Helper – dùng regex để bắt chính xác câu hỏi về bán đồ
  # ---------------------------------------------------------------------------------- #
  shop-helper:
    use-regex: true
    triggers:
      - "\\b(?:how|where)\\s+sell\\b"
      - "sell\\s+items"
      - "lam\\s+sao\\s+de\\s+(?:ban|sell|vut|vứt)\\s+do"
    chance: 0.9
    cooldowns:
      global: 10
      per-player: 20
    max-burst: 1
    delay-range: "2.0-3.5"
    active-hours: "00:00-23:59"
    typing-speed-range: "1.0-2.0"
    pause-between-words: "2-5"
    fuzzy-threshold: 0.85
    replies:
      - "Gõ lệnh /shop để bán đồ nhanh nha [name]!"
      - "Dùng /shop nha bạn ơi"

  # ---------------------------------------------------------------------------------- #
  # Store & Web Link Information
  # ---------------------------------------------------------------------------------- #
  server-ip-info:
    use-regex: true
    triggers:
      - "\\bnap\\s+the\\b"
      - "\\bcua\\s+hang\\b"
      - "\\blink\\s+store\\b"
    chance: 1.0
    cooldowns:
      global: 5
      per-player: 15
    max-burst: 1
    delay-range: "2.0-3.0"
    active-hours: "00:00-23:59"
    typing-speed-range: "0.8-1.5"
    pause-between-words: "2-3"
    fuzzy-threshold: 0.85
    replies:
      - "Ủng hộ server tại web: store.server.net nè [name]"

  # ---------------------------------------------------------------------------------- #
  # Discord & Community Channel Linker
  # ---------------------------------------------------------------------------------- #
  discord-info:
    use-regex: true
    triggers:
      - "\\bdiscord\\b"
      - "group\\s+zolo"
      - "kenh\\s+chat"
      - "\\bgroup\\b"
    chance: 1.0
    cooldowns:
      global: 10
      per-player: 20
    max-burst: 1
    delay-range: "1.5-2.5"
    active-hours: "00:00-23:59"
    typing-speed-range: "0.8-1.5"
    pause-between-words: "2-3"
    fuzzy-threshold: 0.85
    replies:
      - "Tham gia Discord của server tại: discord.gg/server cua ban nha [name]"
      - "Link discord nè [name]: discord.gg/server"

  # ---------------------------------------------------------------------------------- #
  # Server Rules & Moderation Helper – regex chính xác
  # ---------------------------------------------------------------------------------- #
  rule-helper:
    use-regex: true
    triggers:
      - "\\bluat\\s+server\\b"
      - "\\bco\\s+duoc\\s+hack\\b"
      - "\\bcam\\s+pvp\\b"
    chance: 0.8
    cooldowns:
      global: 15
      per-player: 30
    max-burst: 1
    delay-range: "2.0-3.0"
    active-hours: "08:00-22:00"
    typing-speed-range: "0.8-1.8"
    pause-between-words: "2-4"
    fuzzy-threshold: 0.85
    replies:
      - "Xem luật server tại /rules nha bạn [name], cấm hack/cheat nha!"

  # ---------------------------------------------------------------------------------- #
  # Casual check-in (mentions bot or general) – regex bắt câu hỏi thăm
  # ---------------------------------------------------------------------------------- #
  casual-check-in:
    use-regex: true
    triggers:
      - "\\bkhoe\\s+khong\\b"
      - "\\bdao\\s+nay\\s+sao\\b"
      - "\\ban\\s+com\\s+chua\\b"
      - "\\bkhoe\\s+khong\\s+.*"       # bắt cả khi có tên bot sau
      - "\\bdao\\s+nay\\s+sao\\s+.*"
      - "\\ban\\s+com\\s+chua\\s+.*"
    chance: 0.9
    cooldowns:
      global: 10
      per-player: 30
    max-burst: 1
    delay-range: "1.2-2.5"
    active-hours: "00:00-23:59"
    typing-speed-range: "0.7-1.5"
    pause-between-words: "2-4"
    fuzzy-threshold: 0.85
    replies:
      - "Tui khỏe nha [name], cám ơn đã hỏi thăm kkk"
      - "Cũng bình thường à [name] ơi"
      - "Đang cày sấp mặt đây [name] =))"
      - "Vẫn thở đều nha [name] :v"

  # ---------------------------------------------------------------------------------- #
  # Tag a bot directly – giữ wildcard để bắt chính xác khi có [bot] placeholder
  # ---------------------------------------------------------------------------------- #
  tag:
    triggers:
      - "*[bot]*"
    chance: 1.0
    cooldowns:
      global: 5
      per-player: 10
    max-burst: 1
    delay-range: "1.0-2.0"
    active-hours: "00:00-23:59"
    typing-speed-range: "0.5-1.0"
    pause-between-words: "1-3"
    use-regex: false
    fuzzy-threshold: 0.85
    replies:
      - "tag cl"
      - "yes?"
      - "sao đó [name]?"
      - "có gì không [name]?"