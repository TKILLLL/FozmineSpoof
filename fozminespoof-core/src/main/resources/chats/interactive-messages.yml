# ==================================================================================== #
#           FOZMINESPOOF - DYNAMIC KEYWORD CHAT RESPONDER ENGINE                       #
#                       (ENTERPRISE EDITION V2.0)                                      #
# ==================================================================================== #
# High-performance, low-latency automated chat simulation module for fake players.
# Features hybrid processing: Fast substring/fuzzy matching + Deterministic Regex engines.
#
# PLACEHOLDERS REFERENCE:
# - [name] : Resolves to the in-game display name of the triggering player.
# - [bot]  : Resolves to the name of the responding simulated fake player.
# ==================================================================================== #

# Master switch to enable or disable the entire keyword response engine globally.
enable: true

chat-interactions:

  # ---------------------------------------------------------------------------------- #
  # 1. PLAYER GREETINGS & WELCOME AUTOMATION                                           #
  # ---------------------------------------------------------------------------------- #
  # Triggers when players say hello or join the chat conversation.
  # Uses fast wildcard/fuzzy matching for quick, lightweight evaluation.
  player-greeting:
    # Trigger keywords (Matches plain text or wildcards when use-regex: false)
    triggers:
      - "hey"
      - "wassup"
      - "hi"
      - "hello"
      - "yo"
      - "xin chao"
      - "chao mn"

    # Probability to trigger response (0.0 = 0% | 1.0 = 100%)
    chance: 0.7

    # Cooldown matrix to prevent chat floods (Time in seconds)
    cooldowns:
      global: 15       # Minimum delay before ANY fake player can trigger this again
      per-player: 30   # Minimum delay before the SAME player can trigger this again

    # Maximum responses allowed in a single conversation burst
    max-burst: 2

    # Human reaction delay (seconds) before fake player begins typing (Format: "min-max")
    delay-range: "1.5-2.3"

    # Active operational window (24h format: "HH:mm-HH:mm")
    active-hours: "08:00-23:30"

    # Typing speed emulation (seconds per character/word block)
    typing-speed-range: "0.8-1.8"

    # Natural pause interval between individual words to simulate typing rhythm
    pause-between-words: "2-4"

    # Engine selector: false = Substring/Fuzzy matching | true = Regular Expressions
    use-regex: false

    # Fuzzy string matching threshold (0.0 to 1.0). 0.85 allows minor player typos
    fuzzy-threshold: 0.85

    # Randomized pool of candidate replies
    replies:
      - "welcome [name]"
      - "Hey [name]"
      - "Sup [name], how's it going?"
      - "yo [name]!"

  # ---------------------------------------------------------------------------------- #
  # 2. ECONOMY & SHOP HELPER                                                           #
  # ---------------------------------------------------------------------------------- #
  # Detects player questions regarding item selling and economy access using Regex.
  shop-helper:
    # Set to true for precise pattern boundaries (\b, \s+, non-capturing groups)
    use-regex: true
    triggers:
      - "\\b(?:how|where)\\s+to?\\s*sell\\b"
      - "\\blam\\s+sao\\s+ban\\s+do\\b"
      - "\\bban\\s+do\\s+o\\s+dau\\b"

    chance: 0.9
    cooldowns:
      global: 10
      per-player: 20
    max-burst: 1
    delay-range: "2.0-3.5"
    active-hours: "00:00-23:59"
    typing-speed-range: "1.0-2.0"
    pause-between-words: "2-5"
    fuzzy-threshold: 0.85
    replies:
      - "Type /shop to sell your items quickly [name]!"
      - "Use /shop bro"

  # ---------------------------------------------------------------------------------- #
  # 3. WEBSTORE & DONATION LINK DISPATCHER                                             #
  # ---------------------------------------------------------------------------------- #
  # Instantly guides inquiring players to web store links and donation portals.
  server-ip-info:
    use-regex: true
    triggers:
      - "\\bbuy\\s+rank\\b"
      - "\\bweb\\s*store\\b"
      - "\\blink\\s+store\\b"
      - "\\bhow\\s+to\\s+donate\\b"

    chance: 1.0
    cooldowns:
      global: 5
      per-player: 15
    max-burst: 1
    delay-range: "2.0-3.0"
    active-hours: "00:00-23:59"
    typing-speed-range: "0.8-1.5"
    pause-between-words: "2-3"
    fuzzy-threshold: 0.85
    replies:
      - "Support the server at our webstore: store.server.net [name]"

  # ---------------------------------------------------------------------------------- #
  # 4. DISCORD & COMMUNITY CHANNEL LINKER                                              #
  # ---------------------------------------------------------------------------------- #
  # Directs players asking for community groups, voice channels, or Discord invites.
  discord-info:
    use-regex: true
    triggers:
      - "\\bdiscord\\b"
      - "discord\\s+link"
      - "community\\s+chat"
      - "\\bdc\\s+link\\b"

    chance: 1.0
    cooldowns:
      global: 10
      per-player: 20
    max-burst: 1
    delay-range: "1.5-2.5"
    active-hours: "00:00-23:59"
    typing-speed-range: "0.8-1.5"
    pause-between-words: "2-3"
    fuzzy-threshold: 0.85
    replies:
      - "Join our official Discord community: discord.gg/yourserver [name]"
      - "Here's the discord link [name]: discord.gg/yourserver"

  # ---------------------------------------------------------------------------------- #
  # 5. SERVER RULES & MODERATION HELPER                                                #
  # ---------------------------------------------------------------------------------- #
  # Answers questions about rules, cheats, PvP policies, and server regulations.
  rule-helper:
    use-regex: true
    triggers:
      - "\\bserver\\s+rules\\b"
      - "\\bcan\\s+i\\s+hack\\b"
      - "\\bis\\s+pvp\\s+allowed\\b"
      - "\\bhacking\\s+allowed\\b"

    chance: 0.8
    cooldowns:
      global: 15
      per-player: 30
    max-burst: 1
    delay-range: "2.0-3.0"
    active-hours: "08:00-22:00"
    typing-speed-range: "0.8-1.8"
    pause-between-words: "2-4"
    fuzzy-threshold: 0.85
    replies:
      - "Check our server rules via /rules [name], no cheating or hacking allowed!"

  # ---------------------------------------------------------------------------------- #
  # 6. CASUAL PLAYER CHECK-IN & SMALL TALK                                             #
  # ---------------------------------------------------------------------------------- #
  # Realistic human small-talk engine responding to conversational inquiries.
  casual-check-in:
    use-regex: true
    triggers:
      - "\\bhow\\s+are\\s+you\\b"
      - "\\bhows\\s+it\\s+going\\b"
      - "\\bwhats\\s+up\\b"
      - "\\bhow\\s+are\\s+you\\s+.*"       # Catches expressions followed by bot names
      - "\\bhows\\s+it\\s+going\\s+.*"
      - "\\bwhats\\s+up\\s+.*"

    chance: 0.9
    cooldowns:
      global: 10
      per-player: 30
    max-burst: 1
    delay-range: "1.2-2.5"
    active-hours: "00:00-23:59"
    typing-speed-range: "0.7-1.5"
    pause-between-words: "2-4"
    fuzzy-threshold: 0.85
    replies:
      - "I'm doing good [name], thanks for asking lol"
      - "Just chilling here [name]"
      - "Grinding for resources rn [name] =))"
      - "Still alive and kicking [name] :v"

  # ---------------------------------------------------------------------------------- #
  # 7. DIRECT BOT MENTION / TAGGING SYSTEM                                             #
  # ---------------------------------------------------------------------------------- #
  # Triggers when a player explicitly types out a fake player's name in chat.
  tag:
    # Wildcard pattern dynamically matching whenever a bot's specific name is tagged
    triggers:
      - "*[bot]*"

    chance: 1.0
    cooldowns:
      global: 5
      per-player: 10
    max-burst: 1
    # Ultra-fast reaction delay for high realism when directly called
    delay-range: "1.0-2.0"
    active-hours: "00:00-23:59"
    typing-speed-range: "0.5-1.0"
    pause-between-words: "1-3"
    use-regex: false
    fuzzy-threshold: 0.85
    replies:
      - "why ping me lol"
      - "yes?"
      - "what's up [name]?"
      - "need something [name]?"